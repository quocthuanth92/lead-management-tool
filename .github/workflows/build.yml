name: Build Images

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name }}-${{ github.ref }}-build-workflow
  cancel-in-progress: true

run-name: 🚀 Event ${{ github.event_name }} - ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    if: ${{ github.event.pull_request.merged == true && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lead-web
            dockerfile: apps/lead-web/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lead-web
          - name: lead-service
            dockerfile: apps/lead-service/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lead-service
          - name: lead-background-service
            dockerfile: apps/lead-background-service/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lead-background-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
