name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .turbo
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  e2e:
    if: github.head_ref != 'main'
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Placeholder values for CI only. They are not secrets and must never be used outside CI.
      RATE_LIMIT_LIMIT: '1000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the service images and starts the full stack, including the e2e runner profile, from docker-compose.yml.
      - name: Start stack
        run: docker compose --profile e2e up --build --detach --wait --wait-timeout 600 mongo redis kafka lead-service lead-background-service lead-web

      - name: Seed salespeople
        run: docker compose run --rm lead-service node dist/src/cli/seed.js

      - name: Run end-to-end tests
        run: docker compose --profile e2e run --rm e2e

      - name: Upload end-to-end reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            end-to-end/reports/
            end-to-end/reports/failures/
          if-no-files-found: warn

      - name: Collect compose logs
        if: failure()
        run: docker compose --profile e2e logs --no-color --timestamps > compose.log 2>&1

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: compose.log
          if-no-files-found: warn

      - name: Stop stack
        if: always()
        run: docker compose --profile e2e down --volumes --remove-orphans
