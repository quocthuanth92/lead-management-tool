name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .turbo
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  e2e:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Placeholder values for CI only. They are not secrets and must never be used outside CI.
      RATE_LIMIT_LIMIT: '1000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the service images and starts the full stack, including the e2e runner profile, from docker-compose.yml.
      - name: Start stack
        run: docker compose --profile e2e up --build --detach --wait --wait-timeout 600 mongo redis kafka lead-service lead-background-service lead-web

      - name: Seed salespeople
        run: docker compose run --rm lead-service node dist/src/cli/seed.js

      # Kept after exit (no --rm) so the reports can be copied out of the container below.
      - name: Run end-to-end tests
        id: run-e2e
        run: docker compose --profile e2e run --name e2e-runner e2e

      - name: Copy end-to-end reports from container
        if: always()
        run: |
          docker cp e2e-runner:/app/end-to-end/reports ./e2e-report || echo "::warning::No end-to-end reports were found in the container"

      - name: Upload end-to-end reports
        id: upload-reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e-report/
          if-no-files-found: warn

      - name: Comment end-to-end report on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          E2E_OUTCOME: ${{ steps.run-e2e.outcome }}
          ARTIFACT_URL: ${{ steps.upload-reports.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-report -->';
            const reportPath = 'e2e-report/cucumber-report.json';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const link = process.env.ARTIFACT_URL || runUrl;
            let body;
            if (!fs.existsSync(reportPath)) {
              body = `${marker}\n### End-to-end report\n\nNo Cucumber JSON report was produced (test outcome: \`${process.env.E2E_OUTCOME}\`). [Run logs](${runUrl})`;
            } else {
              const features = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              let total = 0;
              const failed = [];
              for (const feature of features) {
                for (const scenario of feature.elements ?? []) {
                  if (scenario.type === 'background') continue;
                  total += 1;
                  const ok = (scenario.steps ?? []).every((step) => ['passed', 'skipped'].includes(step.result?.status));
                  if (!ok) failed.push(`- ${feature.name} › ${scenario.name}`);
                }
              }
              const status = failed.length === 0 && total > 0 ? 'Passed' : 'Failed';
              body = [
                marker,
                '### End-to-end report',
                '',
                `**Result:** ${status}`,
                `**Scenarios:** ${total} total, ${total - failed.length} passed, ${failed.length} failed`,
                '',
                failed.length > 0 ? `**Failed scenarios:**\n${failed.join('\n')}\n` : '',
                `[Download the full HTML report (artifact e2e-reports)](${link})`,
              ].join('\n');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker) && c.user?.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Collect compose logs
        if: failure()
        run: docker compose --profile e2e logs --no-color --timestamps > compose.log 2>&1

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: compose.log
          if-no-files-found: warn

      - name: Stop stack
        if: always()
        run: |
          docker rm -f e2e-runner || true
          docker compose --profile e2e down --volumes --remove-orphans
