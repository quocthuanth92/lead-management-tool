name: lead-management-tool
services:
  mongo:
    container_name: mongo
    image: mongo:7
    command: ['mongod', '--bind_ip_all', '--replSet', 'rs0']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', "mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) { quit(1); }'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    container_name: redis
    image: redis/redis-stack-server:latest
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    container_name: kafka
    image: apache/kafka:latest
    ports:
      - '9092:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1'
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 25s

  lead-service:
    container_name: lead-service
    build:
      context: .
      dockerfile: apps/lead-service/Dockerfile
    env_file:
      - apps/lead-service/.env.example
    # The env files target host-run development on localhost; containers reach each other by service name.
    environment:
      MONGODB_URI: mongodb://mongo:27017/lead?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  lead-background-service:
    container_name: lead-background-service
    build:
      context: .
      dockerfile: apps/lead-background-service/Dockerfile
    env_file:
      - apps/lead-background-service/.env.example
    environment:
      MONGODB_URI: mongodb://mongo:27017/lead?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - '3002:3002'
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  lead-web:
    container_name: lead-web
    build:
      context: .
      dockerfile: apps/lead-web/Dockerfile
    env_file:
      - apps/lead-web/.env.example
    environment:
      LEAD_SERVICE_URL: http://lead-service:3001
    depends_on:
      lead-service:
        condition: service_healthy
    ports:
      - '3000:3000'
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  e2e:
    container_name: e2e
    build:
      context: .
      dockerfile: end-to-end/Dockerfile
    profiles: ['e2e']
    env_file:
      - end-to-end/.env.example
    environment:
      - WEB_BASE_URL=http://lead-web:3000
      - API_BASE_URL=http://lead-service:3001
      - E2E_WEB_URL=http://lead-web:3000
      - E2E_SERVICE_URL=http://lead-service:3001
      - E2E_KAFKA_BROKERS=kafka:9092
    # Chromium needs more shared memory than Docker's 64MB default.
    shm_size: 1gb
    volumes:
      - ./end-to-end/reports:/app/end-to-end/reports
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      lead-background-service:
        condition: service_healthy
      lead-web:
        condition: service_healthy
    restart: 'no'

volumes:
  mongo-data:
