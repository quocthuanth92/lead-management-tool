services:
  mongo:
    container_name: mongo
    image: mongo:7
    command: ['mongod', '--bind_ip_all', '--replSet', 'rs0']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand(''ping'').ok" | grep 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    container_name: redis
    image: redis/redis-stack:latest
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    container_name: kafka
    image: apache/kafka:latest
    ports:
      - '9092:9092'
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES='broker,controller'
      - KAFKA_LISTENERS='PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      - KAFKA_ADVERTISED_LISTENERS='PLAINTEXT://localhost:9092'
      - KAFKA_CONTROLLER_QUORUM_VOTERS='1@localhost:9093'
      - KAFKA_CONTROLLER_LISTENER_NAMES='CONTROLLER'
      - KAFKA_LOG_DIRS='/tmp/kraft-combined-logs'
      - CLUSTER_ID='MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1'
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 25s

  lead-service:
    container_name: lead-service
    build:
      context: .
      dockerfile: apps/lead-service/Dockerfile
    env_file:
      - .env.example
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/lead
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  lead-background-service:
    container_name: lead-background-service
    build:
      context: .
      dockerfile: apps/lead-background-service/Dockerfile
    env_file:
      - .env.example
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongo:27017/lead
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  lead-web:
    container_name: lead-web
    build:
      context: .
      dockerfile: apps/lead-web/Dockerfile
    env_file:
      - .env.example
    environment:
      - LEAD_SERVICE_URL=http://lead-service:3001
    depends_on:
      lead-service:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  e2e:
    container_name: e2e
    build:
      context: .
      dockerfile: end-to-end/Dockerfile
    profiles: ['e2e']
    env_file:
      - .env.example
    environment:
      - WEB_BASE_URL=http://lead-web:3000
      - API_BASE_URL=http://lead-service:3001
    depends_on:
      lead-web:
        condition: service_healthy
      lead-service:
        condition: service_healthy

volumes:
  mongo-data:
