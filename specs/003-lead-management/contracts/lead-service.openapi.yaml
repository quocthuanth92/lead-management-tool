openapi: 3.0.3
info:
  title: Lead Service API (lead management)
  version: 1.0.0
  description: >
    REST contract for lead-service. All paths are under /api/v1. Authenticated routes require
    `Authorization: Bearer <accessToken>`; the lead-web BFF adds it from an httpOnly cookie, the browser
    never sees the token. Errors always use the shared ErrorResponse shape.
servers:
  - url: http://localhost:3001/api/v1
tags:
  - name: Auth
  - name: Leads
  - name: Activities
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in a salesperson
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /leads:
    post:
      tags: [Leads]
      summary: Ingest a lead from a trusted internal system (source = INTERNAL)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeadRequest' }
      responses:
        '201':
          description: Lead stored (unread)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateLeadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Leads]
      summary: Lead inbox (own leads; unread first, then newest update)
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of leads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /leads/search:
    get:
      tags: [Leads]
      summary: Search own leads within a date range (route is declared before /leads/{id})
      description: >
        Case-insensitive substring match on customer name, email, and phone digits; optional label filter.
        Same ordering, date range defaults, and pagination as the inbox. At least one of `q` or `label` is required.
      parameters:
        - name: q
          in: query
          required: false
          description: Plain text; 2-100 characters; never interpreted as a pattern.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: label
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LeadLabel' }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of matching leads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /leads/{id}:
    get:
      tags: [Leads]
      summary: Lead details with newest activities; marks the lead as read
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Lead details (hasView is true in the response)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /leads/{id}/label:
    put:
      tags: [Leads]
      summary: Set the single label of a lead (replaces any previous label)
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLabelRequest' }
      responses:
        '200':
          description: Label updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetLabelResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /leads/{id}/activities:
    get:
      tags: [Activities]
      summary: List a lead's activities, newest first
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of activities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Activities]
      summary: Append a follow-up activity (activities cannot be edited or deleted)
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddActivityRequest' }
      responses:
        '201':
          description: Activity appended; the lead's lastUpdate moves forward
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth: { type: apiKey, in: header, name: x-api-key }
  parameters:
    LeadId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{24}$' }
    FromDate:
      name: fromDate
      in: query
      required: false
      description: ISO 8601 date or date-time. Default is six months before `toDate`.
      schema: { type: string }
    ToDate:
      name: toDate
      in: query
      required: false
      description: ISO 8601 date or date-time (a plain date is inclusive to end of day). Default is now. Must be >= fromDate.
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
  responses:
    BadRequest:
      description: Invalid data (including limit > 200, bad dates, unknown label)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Lead does not exist or is not assigned to the caller (indistinguishable)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        error: { type: string }
    LeadLabel:
      type: string
      enum: [UNLABELED, POTENTIAL, SPAM]
    ActivityType:
      type: string
      enum: [CALL, EMAIL, SMS, NOTE, OTHER]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/SessionUser' }
    SessionUser:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [SALESPERSON, ADMIN] }
    CreateLeadRequest:
      type: object
      additionalProperties: false
      required: [fullName, phone, message]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        phone:
          {
            type: string,
            minLength: 7,
            maxLength: 25,
            description: 'Digits with optional +, spaces, dashes, parentheses; 7-20 digits after normalization'
          }
        email: { type: string, format: email, maxLength: 254 }
        message: { type: string, minLength: 1, maxLength: 2000 }
    CreateLeadResponse:
      type: object
      required: [id]
      properties:
        id: { type: string }
    LeadListItem:
      type: object
      required: [id, customerName, phone, label, hasView, lastUpdate]
      properties:
        id: { type: string }
        customerName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string }
        label: { $ref: '#/components/schemas/LeadLabel' }
        hasView: { type: boolean }
        lastUpdate: { type: string, format: date-time }
    LeadPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LeadListItem' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, description: Total leads matching the filters and date range }
    LeadActivity:
      type: object
      required: [id, leadId, type, content, authorName, createdAt]
      properties:
        id: { type: string }
        leadId: { type: string }
        type: { $ref: '#/components/schemas/ActivityType' }
        content: { type: string }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
    ActivityPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LeadActivity' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    LeadDetails:
      type: object
      required:
        [
          id,
          customerName,
          phone,
          source,
          message,
          label,
          hasView,
          createdAt,
          lastUpdate,
          activities,
          activitiesTotal
        ]
      properties:
        id: { type: string }
        customerName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        source: { type: string, enum: [INTERNAL, EXTERNAL] }
        message: { type: string }
        label: { $ref: '#/components/schemas/LeadLabel' }
        hasView: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastUpdate: { type: string, format: date-time }
        activities:
          type: array
          description: Newest 50 activities, newest first; use /leads/{id}/activities for more
          items: { $ref: '#/components/schemas/LeadActivity' }
        activitiesTotal: { type: integer }
    SetLabelRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { $ref: '#/components/schemas/LeadLabel' }
    SetLabelResponse:
      type: object
      required: [id, label, lastUpdate]
      properties:
        id: { type: string }
        label: { $ref: '#/components/schemas/LeadLabel' }
        lastUpdate: { type: string, format: date-time }
    AddActivityRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        content:
          {
            type: string,
            minLength: 1,
            maxLength: 2000,
            description: Must contain a non-whitespace character
          }
